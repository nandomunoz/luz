<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><title>LUZ</title><style>
/* PROTO logo animation: the prism whole, then its three bands of tone come
   and go, one after another, in a loop. Firefox animates a favicon; Chrome
   draws the first frame (header.js writes the frames there). */
@media (prefers-reduced-motion: no-preference) {
  .b { animation: band 4.8s ease-in-out infinite backwards; stroke: #0066cf; stroke-width: .4; stroke-linejoin: round; stroke-opacity: 0; }
  .b1 { --t: .25; }
  .b2 { --t: .45; animation-delay: .3s; }
  .b3 { --t: .65; animation-delay: .6s; }
}
@keyframes band {
  0%, 12% { fill-opacity: 1; stroke-opacity: 1; }
  32%, 58% { fill-opacity: var(--t); stroke-opacity: 0; }
  78%, 100% { fill-opacity: 1; stroke-opacity: 1; }
}
</style><path class="b b1" fill="#0066cf" fill-opacity="0.25" d="M20.8 10.46 7.04 17.66 23.36 14.89Z"/><path class="b b2" fill="#0066cf" fill-opacity="0.45" d="M23.36 14.89 7.04 17.66 25.92 19.33Z"/><path class="b b3" fill="#0066cf" fill-opacity="0.65" d="M25.92 19.33 7.04 17.66 28.48 23.76Z"/><path fill="#0066cf" fill-rule="evenodd" d="M20.8 10.46 16 2.14 7.04 17.66ZM32 29.86 28.48 23.76 7.04 17.66 0 29.86Z"/></svg>

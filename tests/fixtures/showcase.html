<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUZ catalog: the showcase, luz-showcase</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <link rel="stylesheet" href="/packages/catalog/dist/components/showcase.css">
</head>
<body>
  <!-- tests/showcase.spec.js. No script: the showcase is CSS, and only the still row (the motion is <luz-marquee>, tests/fixtures/marquee.html).
       A logo is a decorative svg (or an img with alt="") and the span is the name of the link.
       The logos are drawn for this page: LUZ ships no brand logo. -->
  <main id="main">
    <h1>Built with LUZ</h1>
    <h2>Five names</h2>
  <luz-showcase id="still">
    <ul>
      <li><a href="#still-0"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/></svg><span>Marea Bikes</span></a></li>
      <li><a href="#still-1"><img alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%274%27 fill=%27%23888%27/%3E%3C/svg%3E"><span>Bodega Sur</span></a></li>
      <li><a href="#still-2"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l9 17H3z"/></svg><span>Faro Press</span></a></li>
      <li><a href="#still-3"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16M12 4v16"/></svg><span>Olivar Studio</span></a></li>
      <li><a href="#still-4"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 19V9l7-5 7 5v10z"/></svg><span>Salinas Co-op</span></a></li>
    </ul>
  </luz-showcase>
    <h2>Three names, in a right-to-left page</h2>
  <luz-showcase id="still-rtl" dir="rtl">
    <ul>
      <li><a href="#still-rtl-0"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/></svg><span>Marea Bikes</span></a></li>
      <li><a href="#still-rtl-1"><img alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%274%27 fill=%27%23888%27/%3E%3C/svg%3E"><span>Bodega Sur</span></a></li>
      <li><a href="#still-rtl-2"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l9 17H3z"/></svg><span>Faro Press</span></a></li>
    </ul>
  </luz-showcase>
    <p><a id="after" href="#after">A link after the rows</a></p>
  </main>
</body>
</html>

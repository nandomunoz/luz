<dialog class="find" aria-label="Search the site">
  <form method="dialog">
    <input type="search" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off">
    <button class="copy" type="submit">Esc</button>
  </form>
  <ul>{{search-index}}</ul>
  <p class="find__none" hidden>No page matches that. Check the spelling or try a shorter word, or browse <a href="{{root}}docs/components.html">the components</a> and <a href="{{root}}docs/color.html">the tokens</a>.</p>
</dialog>

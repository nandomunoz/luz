<!--meta {"title":"Page not found","layout":"lost","description":"This page does not exist."} -->
<main id="main" class="lost">
  <div class="lost__art" data-parallax>{{scale:lost}}</div>
  <div class="wrap lost__in">
    <p class="label">Error 404</p>
    <h1>We can’t find <em>that page.</em></h1>
    <p>The link may be broken, or the page may have moved. Search for it, or start from one of these.</p>
    <form class="lost__find" role="search" data-find-form>
      <label for="lost-q">Search the docs</label>
      <div><input id="lost-q" type="search" autocomplete="off"><button class="btn btn--plain" type="submit">Search</button></div>
    </form>
    <ul class="lost__ways">
      <li><a class="link" href="{{root}}index.html">The home page</a></li>
      <li><a class="link" href="{{root}}docs/index.html">The documentation</a></li>
      <li><a class="link" href="{{root}}docs/components.html">All components</a></li>
    </ul>
  </div>
</main>

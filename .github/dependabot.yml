version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release (compromised versions are
    # usually caught and pulled within days)
    cooldown:
      default-days: 7
    assignees:
      - nandomunoz
    # Automatically rebase and merge dependency updates
    rebase-strategy: "auto"
    # Group updates by type
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    # Ignore versions for major updates (require manual review)
    ignore:
      # Don't auto-update major versions of core tools
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rollup"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # The screen readers of CI (SR-6): a package of its own, outside the workspace
  - package-ecosystem: "npm"
    directory: "/tests/screen-readers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - nandomunoz
    groups:
      screen-readers:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release (compromised versions are
    # usually caught and pulled within days)
    cooldown:
      default-days: 7
    assignees:
      - nandomunoz
    rebase-strategy: "auto"
